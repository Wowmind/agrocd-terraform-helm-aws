httpRoute:
  enabled: false
ingress:
  enabled: false
name: myapp
replicas: 1
image:
  repository: myapp
  tag: latest
containerPort: 8080
service:
  type: LoadBalancer
  port: 8080
  targetPort: 8080
resources: {
  limits: {
    cpu: 250m,
    memory: 256Mi
  },
  requests: {
    cpu: 100m,
    memory: 128Mi
  }
}
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

  