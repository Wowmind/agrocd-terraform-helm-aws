httpRoute:
  enabled: false
ingress:
  enabled: false
name: superboy
replicas: 2
image:
  repository: superboy
  tag: latest
containerPort: 5000
service:
  type: LoadBalancer
  port: 80
  targetPort: 5000
resources: {
  limits: {
    cpu: 250m,
    memory: 256Mi
  },
  requests: {
    cpu: 100m,
    memory: 128Mi
  }
}
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

  